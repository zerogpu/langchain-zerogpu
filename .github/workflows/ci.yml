name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy langchain_zerogpu

      - name: Unit tests (sockets disabled)
        run: uv run pytest --disable-socket tests/unit_tests

  release-check:
    # Merging to main releases whatever version pyproject.toml carries, so a PR
    # that changes the package must carry the bump and its CHANGELOG section.
    name: Version bump + CHANGELOG
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check version bump and CHANGELOG
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          version() { sed -n 's/^version = "\(.*\)"$/\1/p' | head -1; }

          OLD="$(git show "origin/$BASE_REF:pyproject.toml" | version)"
          NEW="$(version < pyproject.toml)"

          if [ "$OLD" = "$NEW" ] && git diff --quiet "origin/$BASE_REF" -- langchain_zerogpu/; then
            echo "No package changes and no version bump — nothing to release."
            exit 0
          fi

          if ! [[ "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=pyproject.toml::version '$NEW' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [ "$NEW" = "$OLD" ] || [ "$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)" != "$NEW" ]; then
            echo "::error file=pyproject.toml::Package changed but the version was not bumped ($BASE_REF has $OLD, this PR has $NEW). Run 'make bump' (or bump-minor / bump-major)."
            exit 1
          fi

          TOP="$(awk '/^## \[/{print; exit}' CHANGELOG.md | sed 's/^## \[\([^]]*\)\].*/\1/')"
          if [ "$TOP" != "$NEW" ]; then
            echo "::error file=CHANGELOG.md::Top CHANGELOG section is '## [$TOP]'. Add a '## [$NEW] - YYYY-MM-DD' section at the top — it becomes the GitHub release notes."
            exit 1
          fi

          echo "Version $OLD -> $NEW with a matching CHANGELOG section. Merging releases it."
