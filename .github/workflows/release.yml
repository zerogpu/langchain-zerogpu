name: Release

# Fully automatic. Push to main -> CI runs -> if CI is green and pyproject.toml
# carries a version that hasn't been released yet, this builds the package,
# tags the commit, publishes to PyPI, and cuts a GitHub Release whose notes are
# the matching CHANGELOG.md section.
#
# A push that doesn't bump the version is a no-op: the run goes green and the
# publish job is skipped. Nothing here needs a button.
#
# PyPI Trusted Publishing (OIDC) — no API token. The trusted publisher on PyPI
# is bound to this file name (release.yml) and the `pypi` environment, so keep
# both as they are.
#
# workflow_dispatch is an escape hatch for retrying a release that died at the
# registry, not the normal path.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # The CI gate. A failed or cancelled CI run never reaches the release, and
    # the event check keeps pull-request CI runs out.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Brings the tags down, which is how "older than the latest" is answered.
          fetch-depth: 0

      # Every skip here is deliberately quiet: a notice or a warning, never a
      # failure. Most pushes to main are not releases, and a red X on each one
      # would train everybody to ignore the X that matters.
      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          LOCK_VERSION="$(awk '/^name = "langchain-zerogpu"$/{getline; print; exit}' uv.lock | sed 's/^version = "\(.*\)"$/\1/')"
          TOP="$(awk '/^## \[/{print; exit}' CHANGELOG.md | sed 's/^## \[\([^]]*\)\].*/\1/')"
          TAG="v$VERSION"
          HIGHEST="$(git tag -l 'v*' | sed 's|^v||' | sort -V | tail -1)"

          PUBLISH=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released. Nothing to release."
          elif [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "::warning::pyproject.toml is $VERSION but uv.lock says $LOCK_VERSION. Run 'uv lock', commit uv.lock, and push again. Not releasing."
          elif [ "$TOP" != "$VERSION" ]; then
            echo "::warning::pyproject.toml is $VERSION but the top CHANGELOG.md section is '## [$TOP]'. Add a '## [$VERSION]' section at the top and push again. Not releasing."
          elif [ -n "$HIGHEST" ] && [ "$(printf '%s\n%s\n' "$HIGHEST" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            # PyPI can't un-publish a bad version, so refuse rather than guess.
            echo "::warning::pyproject.toml is $VERSION, which is older than the latest release $HIGHEST. Not releasing."
          else
            PUBLISH=true
            # A tag left over from a run that failed after tagging: release the
            # commit it points at, not whatever is on main now.
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              SHA="$(git rev-parse "$TAG^{commit}")"
              echo "::notice::$TAG is tagged but not released — retrying the release of $SHA"
            else
              echo "::notice::Releasing $TAG from $SHA"
            fi
          fi

          {
            echo "publish=$PUBLISH"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-zerogpu
    permissions:
      contents: write # tag + GitHub Release
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Before the tag, so a broken CHANGELOG section leaves nothing behind.
      - name: Build release notes from CHANGELOG
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # Lines between `## [<version>]` and the next `## ` heading, with
          # leading/trailing blank lines stripped. Written straight to a file so
          # the notes never round-trip through shell interpolation.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture=1; next }
            capture && (/^## / || /^\[[^]]+\]: /) { exit }
            capture { print }
          ' CHANGELOG.md \
            | awk 'NF{found=1} found{print}' \
            | awk '{lines[NR]=$0} END{n=NR; while(n>0 && lines[n]==""){n--}; for(i=1;i<=n;i++) print lines[i]}' \
            > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error file=CHANGELOG.md::The '## [$VERSION]' section in CHANGELOG.md is empty"
            exit 1
          fi

          {
            echo ""
            echo "### Install"
            echo ""
            echo '```'
            echo "pip install -U langchain-zerogpu==$VERSION"
            echo '```'
          } >> "$NOTES_FILE"

          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      # Pushed with GITHUB_TOKEN, so it doesn't trigger any other workflow.
      - name: Push tag
        env:
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists on origin; reusing it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A retry after a later step failed finds the files already there.
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "langchain-zerogpu $VERSION" \
            --notes-file "$NOTES_FILE" \
            --verify-tag \
            dist/*
